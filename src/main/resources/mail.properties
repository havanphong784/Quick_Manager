# SMTP settings for invoice email notifications.
# You can override every value below by environment variables.
# Preferred auth: set mail.auth.code = base64(username:password)
# Example (PowerShell): [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("your_mail@gmail.com:app_password"))

mail.enabled=true
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true

